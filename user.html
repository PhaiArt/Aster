<script>
(function(){
  try{
    var raw=localStorage.getItem('sq_state_v1');
    var s=raw?JSON.parse(raw):null;
    var t=(s&&s.app&&s.app.theme)||'light';
    var dark=t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    document.documentElement.style.colorScheme=dark?'dark':'light';
    if(dark){ var m=document.getElementById('themeColor'); if(m) m.setAttribute('content','#101012'); }
  }catch(e){}
})();
</script>
